name: Patch Binary mobile entry quote
on:
  push:
    paths:
      - '.github/workflows/patch-mobile-binary-entry-quote.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch execution snapshot safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Backend/services/deriv_binary_execution_service.py')
          s=p.read_text()
          old='''    with chosen.begin() as connection:\n        row = connection.execute(select(binary_executions).where((binary_executions.c.user_id == user_id) &\n            (binary_executions.c.deriv_account_id == deriv_account_id)).order_by(binary_executions.c.created_at.desc()).limit(1)).mappings().first()\n    public_fields = ('''
          new='''    relay_entry_quote = None\n    with chosen.begin() as connection:\n        row = connection.execute(select(binary_executions).where((binary_executions.c.user_id == user_id) &\n            (binary_executions.c.deriv_account_id == deriv_account_id)).order_by(binary_executions.c.created_at.desc()).limit(1)).mappings().first()\n        if row:\n            relay_row = connection.execute(\n                select(relay_signals.c.entry_quote).where(relay_signals.c.signal_id == row["signal_id"]).limit(1)\n            ).first()\n            if relay_row and relay_row[0] is not None:\n                relay_entry_quote = float(relay_row[0])\n    public_fields = ('''
          if old not in s:
              raise SystemExit('execution_snapshot anchor not found')
          s=s.replace(old,new,1)
          old2='''    public = {field: row[field] for field in public_fields} if row else None\n    return {"ok": True, "account": setting,'''
          new2='''    public = {field: row[field] for field in public_fields} if row else None\n    if public is not None:\n        # The relay entry quote is the underlying EURUSD decision price. It is safe\n        # to expose only for this already user/account-scoped execution snapshot and\n        # lets the mobile UI show whether a running CALL/PUT is currently above or\n        # below its entry without exposing the relay payload itself.\n        public["entry_quote"] = relay_entry_quote\n    return {"ok": True, "account": setting,'''
          if old2 not in s:
              raise SystemExit('public snapshot anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          python -m py_compile Backend/services/deriv_binary_execution_service.py
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/patch-mobile-binary-entry-quote.yml
          git config user.name 'FlowSignal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Backend/services/deriv_binary_execution_service.py .github/workflows/patch-mobile-binary-entry-quote.yml
          git commit -m 'Expose scoped Binary entry quote for live contract UI [skip mobile entry patch]'
          git push
