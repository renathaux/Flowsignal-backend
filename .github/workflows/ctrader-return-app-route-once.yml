name: Use app route after cTrader OAuth once

on:
  push:
    paths:
      - '.github/workflows/ctrader-return-app-route-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update callback destination
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Backend/api.py')
          s=p.read_text(encoding='utf-8')
          old='redirect_url = f"{frontend_url}/app.html?brokerAccounts=1&ctrader={status}"'
          new='redirect_url = f"{frontend_url}/app?brokerAccounts=1&ctrader={status}"'
          if old not in s:
              raise SystemExit('Expected cTrader app.html redirect not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/api.py
          git rm .github/workflows/ctrader-return-app-route-once.yml
          git commit -m "Return cTrader OAuth to authenticated app route"
          git push
