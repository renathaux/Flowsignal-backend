name: Fix cTrader OAuth return once

on:
  push:
    paths:
      - '.github/workflows/fix-ctrader-return-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Route cTrader OAuth back to authenticated app
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Backend/api.py')
          text = path.read_text(encoding='utf-8')
          old = 'redirect_url = f"{frontend_url}/?brokerAccounts=1&ctrader={status}"'
          new = 'redirect_url = f"{frontend_url}/app.html?brokerAccounts=1&ctrader={status}"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 OAuth frontend redirect, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/api.py
          git rm .github/workflows/fix-ctrader-return-once.yml
          git commit -m "Return cTrader OAuth to authenticated app"
          git push
