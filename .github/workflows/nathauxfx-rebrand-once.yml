name: NathauxFX backend one-time rebrand

on:
  push:
    paths:
      - .github/workflows/nathauxfx-rebrand-once.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe backend brand replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('Backend/api.py')
          text = api.read_text(encoding='utf-8')
          api_replacements = {
              'FlowSignal New Signal Alert': 'NathauxFX New Signal Alert',
              'FlowSignal Alert:': 'NathauxFX Alert:',
              'FlowSignal backend is running': 'NathauxFX backend is running',
              'FlowSignal Feedback': 'NathauxFX Feedback',
              'existing FlowSignal access': 'existing NathauxFX access',
              'Invalid FlowSignal access code.': 'Invalid NathauxFX access code.',
              'FlowSignal must mirror them': 'NathauxFX must mirror them',
              'Returning to FlowSignal...': 'Returning to NathauxFX...',
              'FlowSignal tracking stopped; broker positions were not auto-closed.': 'NathauxFX tracking stopped; broker positions were not auto-closed.',
          }
          for old, new in api_replacements.items():
              text = text.replace(old, new)
          api.write_text(text, encoding='utf-8')

          connector = Path('Backend/ctrader_connector.py')
          text = connector.read_text(encoding='utf-8')
          connector_replacements = {
              'which must be TP2 for FlowSignal trades.': 'which must be TP2 for NathauxFX trades.',
              '"label": "FlowSignal"': '"label": "NathauxFX"',
              'f"FlowSignal auto trade {symbol}"': 'f"NathauxFX auto trade {symbol}"',
              'Use FlowSignal gold risk pip = 0.01 instead of cTrader fractional tick pip': 'Use NathauxFX gold risk pip = 0.01 instead of cTrader fractional tick pip',
              'https://api.flowsignalfx.com/ctrader/callback': 'https://api.nathauxfx.com/ctrader/callback',
          }
          for old, new in connector_replacements.items():
              text = text.replace(old, new)
          connector.write_text(text, encoding='utf-8')
          PY
      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nathauxfx-rebrand-once.yml
          git add Backend/api.py Backend/ctrader_connector.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebrand backend and cTrader labels to NathauxFX"
          git push
