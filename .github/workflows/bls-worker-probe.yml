name: BLS worker connectivity probe

on:
  push:
    branches:
      - agent/bls-worker-probe
    paths:
      - ".github/workflows/bls-worker-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Run read-only BLS probe
        run: python -m fundamentals.bls_worker_probe --from 2026-06-01 --to 2026-06-30
