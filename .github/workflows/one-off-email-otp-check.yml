name: One-off email OTP verification checks

on:
  push:
    branches:
      - codex/email-otp-verification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: pip install pytest sqlalchemy fastapi
      - name: Compile OTP auth files
        run: python -m py_compile Backend/services/email_service.py Backend/services/user_auth_service.py Backend/routes/user_auth.py Backend/migrations/versions/20260820_0011_email_verification_otp.py
      - name: Run OTP tests
        working-directory: Backend
        run: python -m pytest -q tests/test_email_verification_otp.py
      - name: Verify migration chain
        run: |
          grep -q 'revision: str = "20260820_0011"' Backend/migrations/versions/20260820_0011_email_verification_otp.py
          grep -q 'down_revision: Union\[str, None\] = "20260818_0010"' Backend/migrations/versions/20260820_0011_email_verification_otp.py
